<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f0f4f8"/>
  
  <!-- Cloud -->
  <ellipse cx="200" cy="50" rx="80" ry="30" fill="#4a90d9"/>
  <ellipse cx="160" cy="60" rx="50" ry="25" fill="#4a90d9"/>
  <ellipse cx="240" cy="60" rx="50" ry="25" fill="#4a90d9"/>
  <text x="200" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">CLOUD</text>
  
  <!-- Fog Layer 1 -->
  <rect x="50" y="100" width="300" height="40" rx="10" fill="#7cb342" opacity="0.7"/>
  <text x="200" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="bold">FOG NODES</text>
  
  <!-- Fog Layer 2 -->
  <rect x="50" y="150" width="300" height="40" rx="10" fill="#8bc34a" opacity="0.7"/>
  <text x="200" y="175" text-anchor="middle" fill="white" font-size="11" font-weight="bold">GATEWAYS</text>
  
  <!-- Devices -->
  <rect x="80" y="220" width="40" height="30" rx="5" fill="#ff9800"/>
  <rect x="180" y="220" width="40" height="30" rx="5" fill="#ff9800"/>
  <rect x="280" y="220" width="40" height="30" rx="5" fill="#ff9800"/>
  
  <!-- Device labels -->
  <text x="100" y="265" text-anchor="middle" fill="#333" font-size="9">IoT</text>
  <text x="200" y="265" text-anchor="middle" fill="#333" font-size="9">IoT</text>
  <text x="300" y="265" text-anchor="middle" fill="#333" font-size="9">IoT</text>
  
  <!-- Arrows -->
  <line x1="100" y1="220" x2="100" y2="190" stroke="#666" stroke-width="2"/>
  <line x1="200" y1="220" x2="200" y2="190" stroke="#666" stroke-width="2"/>
  <line x1="300" y1="220" x2="300" y2="190" stroke="#666" stroke-width="2"/>
  
  <line x1="100" y1="150" x2="100" y2="140" stroke="#666" stroke-width="2"/>
  <line x1="200" y1="150" x2="200" y2="140" stroke="#666" stroke-width="2"/>
  <line x1="300" y1="150" x2="300" y2="140" stroke="#666" stroke-width="2"/>
  
  <line x1="150" y1="100" x2="150" y2="80" stroke="#666" stroke-width="2"/>
  <line x1="250" y1="100" x2="250" y2="80" stroke="#666" stroke-width="2"/>
  
  <!-- Title -->
  <text x="200" y="295" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Fog Computing Architecture</text>
</svg>
