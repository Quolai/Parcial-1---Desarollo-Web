<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#f0f4f8"/>
  
  <!-- Cloud -->
  <ellipse cx="200" cy="40" rx="70" ry="25" fill="#4a90d9"/>
  <ellipse cx="165" cy="50" rx="45" ry="20" fill="#4a90d9"/>
  <ellipse cx="235" cy="50" rx="45" ry="20" fill="#4a90d9"/>
  <text x="200" y="45" text-anchor="middle" fill="white" font-size="11" font-weight="bold">CLOUD</text>
  
  <!-- Network lines -->
  <line x1="200" y1="70" x2="100" y2="120" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="200" y1="70" x2="200" y2="120" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="200" y1="70" x2="300" y2="120" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Edge Devices -->
  <circle cx="100" cy="140" r="35" fill="#e91e63"/>
  <text x="100" y="145" text-anchor="middle" fill="white" font-size="10" font-weight="bold">EDGE</text>
  
  <circle cx="200" cy="140" r="35" fill="#e91e63"/>
  <text x="200" y="145" text-anchor="middle" fill="white" font-size="10" font-weight="bold">EDGE</text>
  
  <circle cx="300" cy="140" r="35" fill="#e91e63"/>
  <text x="300" y="145" text-anchor="middle" fill="white" font-size="10" font-weight="bold">EDGE</text>
  
  <!-- Processing indicators -->
  <rect x="85" y="180" width="30" height="20" rx="3" fill="#9c27b0"/>
  <rect x="185" y="180" width="30" height="20" rx="3" fill="#9c27b0"/>
  <rect x="285" y="180" width="30" height="20" rx="3" fill="#9c27b0"/>
  
  <!-- Data flow arrows -->
  <line x1="100" y1="175" x2="100" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="175" x2="200" y2="200" stroke="#666" stroke-width="2"/>
  <line x1="300" y1="175" x2="300" y2="200" stroke="#666" stroke-width="2"/>
  
  <!-- End devices -->
  <rect x="70" y="210" width="60" height="40" rx="5" fill="#ff9800"/>
  <rect x="170" y="210" width="60" height="40" rx="5" fill="#ff9800"/>
  <rect x="270" y="210" width="60" height="40" rx="5" fill="#ff9800"/>
  
  <!-- Device labels -->
  <text x="100" y="235" text-anchor="middle" fill="white" font-size="9">SENSOR</text>
  <text x="200" y="235" text-anchor="middle" fill="white" font-size="9">SENSOR</text>
  <text x="300" y="235" text-anchor="middle" fill="white" font-size="9">SENSOR</text>
  
  <!-- Local processing indicator -->
  <text x="100" y="270" text-anchor="middle" fill="#333" font-size="8">Local Processing</text>
  <text x="200" y="270" text-anchor="middle" fill="#333" font-size="8">Local Processing</text>
  <text x="300" y="270" text-anchor="middle" fill="#333" font-size="8">Local Processing</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="200" y="295" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Edge Computing Architecture</text>
</svg>
